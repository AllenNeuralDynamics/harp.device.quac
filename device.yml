%YAML 1.1
---
# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/device.json
device: quac
whoAmI: 1406
firmwareVersion: "0.1"
hardwareTargets: "0.0"
registers:
  DOPortState:
    address: 32
    type: U8
    access: Write
    maskType: DOPort
    description: "Read or write the state of the digital IO pins."
  DOPortSet:
    address: 33
    type: U8
    access: Write
    maskType: DOPort
    description: "Set digital IO pins specified in the mask to logic HIGH by
      setting the corresponding bit."
  DOPortClear:
    address: 34
    type: U8
    access: Write
    maskType: DOPort
    description: "Set digital IO specified pins in the mask to logic LOW by
      setting the corresponding bit."

  ExtTriggerState:
    address: 35
    type: U8
    access: Read
    maskType: DOPort
    description: "Read the raw state of the external trigger pins."

  AnalogOutputPortState:
    address: 36
    type: U16
    access: Write
    length: 4
    description: "Read/Write the analog output of all 4 Analog output channels.
      Warning: Write values only take effect if all analog output
      channels are not busy playing a preset waveform. Write error
      otherwise.
      Warning: Read values are only valid if all analog output
      channels are not busy playing a preset waveform. Read error
      otherwise."

  AnalogOutputChannel0:
    address: 37
    type: U16
    access: Write
    description: "Read/Set the value of analog output channel 0.
      Warning: Write values only take effect if the analog output
      channel is not busy playing a preset waveform. Write error
      otherwise.
      Warning: Returns a READ_ERROR if any AO channel is currently
      busy playing a preset waveform."

  AnalogOutputChannel1:
    address: 38
    type: U16
    access: Write
    description: "Read/Set the value of analog output channel 1.
      Warning: Write values only take effect if this channel is not
      busy playing a preset waveform. Write error otherwise.
      Warning: Returns a READ_ERROR if any AO channel is currently
      busy playing a preset waveform."

  AnalogOutputChannel2:
    address: 39
    type: U16
    access: Write
    description: "Read/Set the value of analog output channel 2.
      Warning: Write values only take effect if this channel is not
      busy playing a preset waveform. Write error otherwise.
      Warning: Returns a READ_ERROR if any AO channel is currently
      busy playing a preset waveform."

  AnalogOutputChannel3:
    address: 40
    type: U16
    access: Write
    description: "Read/Set the value of analog output channel 3.
      Warning: Write values only take effect if this channel is not
      busy playing a preset waveform. Write error otherwise.
      Warning: Returns a READ_ERROR if any AO channel is currently
      busy playing a preset waveform."

  DACReady:
    address: 41
    type: U8
    access: Read
    maskType: AOPort
    description: ""

  DACStart:
    address: 42
    type: U8
    access: Write, Event
    maskType: AOPort
    description: "Write to this register to start any/all ready channels.
      Events received from this register represent a bitmask of
      channels started via external trigger."

  DACPause:
    address: 43
    type: U8
    access: Write
    maskType: AOPort
    description: "Write to this register to pause/resume any/all busy channels.
      Writing a 1 pauses the corresponding channel. Writing a 0
      resumes the corresponding channel."

  DACAbort:
    address: 44
    type: U8
    access: Write
    maskType: AOPort
    description: ""

  DACFinished:
    address: 45
    type: U8
    access: Event
    maskType: AOPort
    description: ""

  ChannelExternalTriggers0:
    address: 46
    type: U8
    access: Write
    description: "For Analog 0utput Channel 0, which Digital
      Input pins, specified by mask, can trigger the channel
      to start."
  ChannelExternalTriggers1:
    address: 47
    type: U8
    access: Write
    description: "For Analog Output Channel 1, which Digital
      Input pins, specified by mask, can trigger the channel
      to start."
  ChannelExternalTriggers2:
    address: 48
    type: U8
    access: Write
    description: "For Analog Output Channel 2, which Digital
      Input pins, specified by mask, can trigger the channel
      to start."
  ChannelExternalTriggers3:
    address: 49
    type: U8
    access: Write
    description: "For Analog Output Channel 3, which Digital
      Input pins, specified by mask, can trigger the channel
      to start."

  ActivePlayers0:
    address: 50
    type: U8
    access: Write
    description: "For Analog Output Channel 0, which waveform
      player is active: file, sine, or trapezoid."
  ActivePlayers1:
    address: 51
    type: U8
    access: Write
    description: "For Analog Output Channel 1, which waveform
      player is active: file, sine, or trapezoid."
  ActivePlayers2:
    address: 52
    type: U8
    access: Write
    description: "For Analog Output Channel 2, which waveform
      player is active: file, sine, or trapezoid."
  ActivePlayers3:
    address: 53
    type: U8
    access: Write
    description: "For Analog Output Channel 3, which waveform
      player is active: file, sine, or trapezoid."

  FileSettings0:
    address: 54
    type: U8
    access: Write
    length: 45
    description: "Struct to configure Analog Output Channel 0
      File Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), path (U8 array, 33 elements)"
  FileSettings1:
    address: 55
    type: U8
    access: Write
    length: 45
    description: "Struct to configure Analog Output Channel 1
      File Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), path (U8 array, 33 elements)"
  FileSettings2:
    address: 56
    type: U8
    access: Write
    length: 45
    description: "Struct to configure Analog Output Channel 2
      File Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), path (U8 array, 33 elements)"
  FileSettings3:
    address: 57
    type: U8
    access: Write
    length: 45
    description: "Struct to configure Analog Output Channel 3
      File Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), path (U8 array, 33 elements)"

  SineSettings0:
    address: 58
    type: U8
    access: Write
    length: 24
    description: "Struct to configure Analog Output Channel 0
      Sine Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), frequency_hz (U32),
      amplitude_volts (Float), vertical_shift_volts (Float)."
  SineSettings1:
    address: 59
    type: U8
    access: Write
    length: 24
    description: "Struct to configure Analog Output Channel 1
      Sine Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), frequency_hz (U32),
      amplitude_volts (Float), vertical_shift_volts (Float)."
  SineSettings2:
    address: 60
    type: U8
    access: Write
    length: 24
    description: "Struct to configure Analog Output Channel 2
      Sine Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), frequency_hz (U32),
      amplitude_volts (Float), vertical_shift_volts (Float)."
  SineSettings3:
    address: 61
    type: U8
    access: Write
    length: 24
    description: "Struct to configure Analog Output Channel 3
      Sine Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), frequency_hz (U32),
      amplitude_volts (Float), vertical_shift_volts (Float)."

  TrapezoidSettings0:
    address: 62
    type: U8
    access: Write
    length: 32
    description: "Struct to configure Analog Output Channel 0
      Trapezoid Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), frequency_hz (U32),
      amplitude_volts (Float), vertical_shift_volts (Float),
      ramp_on_us (U32), ramp_off_us (U32)"
  TrapezoidSettings1:
    address: 63
    type: U8
    access: Write
    length: 32
    description: "Struct to configure Analog Output Channel 1
      Trapezoid Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), frequency_hz (U32),
      amplitude_volts (Float), vertical_shift_volts (Float),
      ramp_on_us (U32), ramp_off_us (U32)"
  TrapezoidSettings2:
    address: 64
    type: U8
    access: Write
    length: 32
    description: "Struct to configure Analog Output Channel 2
      Trapezoid Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), frequency_hz (U32),
      amplitude_volts (Float), vertical_shift_volts (Float),
      ramp_on_us (U32), ramp_off_us (U32)"
  TrapezoidSettings3:
    address: 65
    type: U8
    access: Write
    length: 32
    description: "Struct to configure Analog Output Channel 3
      Trapezoid Player settings: cycles (U32), duration_us (U32),
      update_frequency_hz (U32), frequency_hz (U32),
      amplitude_volts (Float), vertical_shift_volts (Float),
      ramp_on_us (U32), ramp_off_us (U32)"

bitMasks:
  DOPort:
    description: "Available digital output pins on the device"
    bits:
      None: 0x0
      DO0: 0x1
      DO1: 0x2
      DO2: 0x4
      DO3: 0x8
  AOPort:
    description: "Available +/-10V analog outputs on the device"
    bits:
      None: 0x0
      AO0: 0x1
      AO1: 0x2
      AO2: 0x4
      AO3: 0x8
