%YAML 1.1
---
# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/device.json
device: quac
whoAmI: 1406
firmwareVersion: "0.1"
hardwareTargets: "0.0"
registers:
  DIOPortDir:
    address: 32
    type: U8
    access: Write
    maskType: DIOPort
    description: "Set the direction of the digial IO pins. 0 = input; 1 = output"
  DIOPortState:
    address: 33
    type: U8
    access: Write
    maskType: DIOPort
    description: "Read or write the state of the digital IO pins."
  DIOPortSet:
    address: 34
    type: U8
    access: Write
    maskType: DIOPort
    description: "Set digital IO pins specified in the mask to logic HIGH by setting the corresponding bit."
  DIOPortClear:
    address: 35
    type: U8
    access: Write
    maskType: DIOPort
    description: "Set digital IO specified pins in the mask to logic LOW by setting the corresponding bit."

  DACReady:
    address: 36
    type: U8
    access: Read
    maskType: AOPort
    description: ""

  DACStart:
    address: 37
    type: U8
    access: Write
    maskType: AOPort
    description: ""

  DACAbort:
    address: 38
    type: U8
    access: Write
    maskType: AOPort
    description: ""

  DACFinished:
    address: 39
    type: U8
    access: Event
    maskType: AOPort
    description: ""

  WaveformSettings0:
    address: 40
    type: U8
    access: Write
    length: 13
    description: "Struct to configure AO0 Waveform settings:
                  cycles (U32), sample_count (U32), frequency_hz (U32),
                  external_triggers (U8)"

  WaveformSettings1:
    address: 41
    type: U8
    access: Write
    length: 13
    description: "Struct to configure AO1 Waveform settings:
                  cycles (U32), sample_count (U32), frequency_hz (U32),
                  external_triggers (U8)"

  WaveformSettings2:
    address: 42
    type: U8
    access: Write
    length: 13
    description: "Struct to configure AO2 Waveform settings:
                  cycles (U32), sample_count (U32), frequency_hz (U32),
                  external_triggers (U8)"

  WaveformSettings3:
    address: 43
    type: U8
    access: Write
    length: 13
    description: "Struct to configure AO3 Waveform settings:
                  cycles (U32), sample_count (U32), frequency_hz (U32),
                  external_triggers (U8)"

  WaveformHash0:
    address: 44
    type: U8
    access: Read
    length: 8
    description: "Read-only SHA256 hash corresponding to AO0 Waveform."

  WaveformHash1:
    address: 45
    type: U8
    access: Read
    length: 8
    description: "Read-only SHA256 hash corresponding to AO1 Waveform."

  WaveformHash2:
    address: 46
    type: U8
    access: Read
    length: 8
    description: "Read-only SHA256 hash corresponding to AO2 Waveform."

  WaveformHash3:
    address: 46
    type: U8
    access: Read
    length: 8
    description: "Read-only SHA256 hash corresponding to AO3 Waveform."

bitMasks:
  DIOPort:
    description: "Available digital IO pins on the device"
    bits:
      None: 0x0
      DIO0: 0x1
      DIO1: 0x2
      DIO2: 0x4
      DIO3: 0x8
  AOPort:
    description: "Available +/-10V analog outputs on the device"
    bits:
      None: 0x0
      AO0: 0x1
      AO1: 0x2
      AO2: 0x4
      AO3: 0x8
