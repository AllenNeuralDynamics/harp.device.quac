%YAML 1.1
---
# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/device.json
device: Quac
whoAmI: 1411
firmwareVersion: "0.1"
hardwareTargets: "1.1"

registers:
  DOPortState:
    address: 32
    type: U8
    access: Write
    maskType: DigitalOutputs
    description: Reflects and specifies the state of the digital output lines.
  DOPortSet:
    address: 33
    type: U8
    access: Write
    maskType: DigitalOutputs
    description: Sets the digital output lines specified in the mask to logic HIGH.
  DOPortClear:
    address: 34
    type: U8
    access: Write
    maskType: DigitalOutputs
    description: Clears the digital output lines specified in the mask to logic LOW.

  DIPortState:
    address: 35
    type: U8
    access: Read
    maskType: DigitalInputs
    description: Reflects the raw state of the digital input lines.

  DIPortInvert:
    address: 36
    type: U8
    access: Write
    maskType: DigitalInputs
    description: >-
      Bits set in this register will INVERT the downstream corresponding DI pin
      function, i.e: DI pins specified as an external trigger will trigger when
      the pin goes LOW. Note that downstream DI pin settings are unaware of this
      inversion setting and specified as normal.

  AOPortState:
    address: 37
    type: Float
    length: 4
    access: Write
    description: >-
      Reflects and specifies the output voltage of all four analog output
      channels in volts, failing reads and writes unless every channel is idle
      since a channel playing a preset waveform owns its output value.
    payloadSpec:
      AOChannel0:
        offset: 0
        description: The output voltage of analog output channel 0 in volts.
      AOChannel1:
        offset: 1
        description: The output voltage of analog output channel 1 in volts.
      AOChannel2:
        offset: 2
        description: The output voltage of analog output channel 2 in volts.
      AOChannel3:
        offset: 3
        description: The output voltage of analog output channel 3 in volts.

  AOChannel0: &aoChannel
    address: 38
    type: Float
    access: Write
    minValue: -10
    maxValue: 10
    defaultValue: 0
    description: >-
      Reflects and specifies the output voltage of analog output channel 0 in
      volts, failing writes while this channel is playing a preset waveform and
      reads while any channel is.
  AOChannel1:
    <<: *aoChannel
    address: 39
    description: >-
      Reflects and specifies the output voltage of analog output channel 1 in
      volts, failing writes while this channel is playing a preset waveform and
      reads while any channel is.
  AOChannel2:
    <<: *aoChannel
    address: 40
    description: >-
      Reflects and specifies the output voltage of analog output channel 2 in
      volts, failing writes while this channel is playing a preset waveform and
      reads while any channel is.
  AOChannel3:
    <<: *aoChannel
    address: 41
    description: >-
      Reflects and specifies the output voltage of analog output channel 3 in
      volts, failing writes while this channel is playing a preset waveform and
      reads while any channel is.

  DacReady:
    address: 42
    type: U8
    access: Read
    maskType: AnalogOutputs
    description: Reflects which analog output channels are configured and ready to start.
  DacStart:
    address: 43
    type: U8
    access: [Write, Event]
    maskType: AnalogOutputs
    description: >-
      Starts the waveform player on the ready analog output channels specified
      in the mask and reports, through events, the channels started by an
      external trigger.
  DacPause:
    address: 44
    type: U8
    access: Write
    maskType: AnalogOutputs
    description: Pauses the channels set in the mask and resumes those cleared in it.
  DacAbort:
    address: 45
    type: U8
    access: Write
    maskType: AnalogOutputs
    description: Aborts waveform playback on the analog output channels specified in the mask.
  DacFinished:
    address: 46
    type: U8
    access: Event
    maskType: AnalogOutputs
    description: Reports which analog output channels have finished playing their waveform.

  PinModeDI0: &diPinMode
    address: 47
    type: U8
    access: Write
    maskType: DIPinMode
    description: Specifies the function assigned to digital input pin 0.
  PinModeDI1:
    <<: *diPinMode
    address: 48
    description: Specifies the function assigned to digital input pin 1.
  PinModeDI2:
    <<: *diPinMode
    address: 49
    description: Specifies the function assigned to digital input pin 2.
  PinModeDI3:
    <<: *diPinMode
    address: 50
    description: Specifies the function assigned to digital input pin 3.

  AOChannelsAssignedToDI0: &AOChannelAssignmentToDI
    address: 51
    type: U8
    access: Write
    maskType: DigitalInputs
    description: Specifies which AO channels are assigned to DI Pin 0.
  AOChannelsAssignedToDI1:
    <<: *AOChannelAssignmentToDI
    address: 52
    description: Specifies which AO channels are assigned to DI Pin 1.
  AOChannelsAssignedToDI2:
    <<: *AOChannelAssignmentToDI
    address: 53
    description: Specifies which AO channels are assigned to DI Pin 2.
  AOChannelsAssignedToDI3:
    <<: *AOChannelAssignmentToDI
    address: 54
    description: Specifies which AO channels are assigned to DI Pin 3.

  DO0PinMode: &doPinMode
    access: Write
    address: 55
    type: U8
    maskType: DOPinMode
    defaultValue: 0
    description: >
      Digital Output 0's pin function assignment ("None" or "Tracking")
  DO1PinMode:
    <<: *doPinMode
    address: 56
    description: >
      Digital Output 1's pin function assignment ("None" or "Tracking")
  DO2PinMode:
    <<: *doPinMode
    address: 57
    description: >
      Digital Output 2's pin function assignment ("None" or "Tracking")
  DO3PinMode:
    <<: *doPinMode
    address: 58
    description: >
      Digital Output 3's pin function assignment ("None" or "Tracking")

  AOChannelsAssignedToDO0: &AOChannelAssignmentToDO
    address: 59
    type: U8
    access: Write
    maskType: DigitalOutputs
    description: Specifies which AO channels are assigned to DO Pin 0.
  AOChannelsAssignedToDO1:
    <<: *AOChannelAssignmentToDO
    address: 60
    description: Specifies which AO channels are assigned to DO Pin 1.
  AOChannelsAssignedToDO2:
    <<: *AOChannelAssignmentToDO
    address: 61
    description: Specifies which AO channels are assigned to DO Pin 2.
  AOChannelsAssignedToDO3:
    <<: *AOChannelAssignmentToDO
    address: 62
    description: Specifies which AO channels are assigned to DO Pin 3.


  ActivePlayer0: &activePlayer
    address: 63
    type: U8
    access: Write
    maskType: PlayerType
    description: Specifies which waveform player drives analog output channel 0.
  ActivePlayer1:
    <<: *activePlayer
    address: 64
    description: Specifies which waveform player drives analog output channel 1.
  ActivePlayer2:
    <<: *activePlayer
    address: 65
    description: Specifies which waveform player drives analog output channel 2.
  ActivePlayer3:
    <<: *activePlayer
    address: 66
    description: Specifies which waveform player drives analog output channel 3.

  FileSettings0: &fileSettings
    address: 67
    type: U8
    length: 45
    access: Write
    description: Specifies the file player settings for analog output channel 0.
    payloadSpec:
      Cycles:
        offset: 0
        length: 4
        interfaceType: uint
        defaultValue: 1
        description: >-
          Specifies how many times the waveform is played, or zero to play it
          indefinitely.
      Duration:
        offset: 4
        length: 4
        interfaceType: uint
        defaultValue: 0
        description: >-
          Specifies the duration of a single cycle in microseconds, or zero to
          play the whole waveform.
      UpdateFrequency:
        offset: 8
        length: 4
        interfaceType: uint
        defaultValue: 500000
        description: Specifies the sample update rate in hertz.
      Path:
        offset: 12
        length: 33
        interfaceType: string
        description: Specifies the null-terminated path of the waveform file on the SD card.
  FileSettings1:
    <<: *fileSettings
    address: 68
    description: Specifies the file player settings for analog output channel 1.
  FileSettings2:
    <<: *fileSettings
    address: 69
    description: Specifies the file player settings for analog output channel 2.
  FileSettings3:
    <<: *fileSettings
    address: 70
    description: Specifies the file player settings for analog output channel 3.

  SineSettings0: &sineSettings
    address: 71
    type: U8
    length: 28
    access: Write
    description: Specifies the sine player settings for analog output channel 0.
    # Shared by the sine and trapezoid player settings, mirroring the struct
    # hierarchy in firmware/inc/waveform_settings.h.
    payloadSpec: &functionPayload
      Cycles:
        offset: 0
        length: 4
        interfaceType: uint
        defaultValue: 1
        description: >-
          Specifies how many times the waveform is played, or zero to play it
          indefinitely.
      Duration:
        offset: 4
        length: 4
        interfaceType: uint
        defaultValue: 0
        description: >-
          Specifies the duration of a single cycle in microseconds, or zero to
          play the whole waveform.
      UpdateFrequency:
        offset: 8
        length: 4
        interfaceType: uint
        defaultValue: 500000
        description: Specifies the sample update rate in hertz.
      Frequency:
        offset: 12
        length: 4
        interfaceType: uint
        defaultValue: 1
        description: Specifies the frequency of the waveform in hertz.
      Amplitude:
        offset: 16
        length: 4
        interfaceType: float
        minValue: 0
        maxValue: 10
        defaultValue: 1
        description: >-
          Specifies the peak amplitude of the waveform in volts, measured from
          its vertical centre.
      VerticalShift:
        offset: 20
        length: 4
        interfaceType: float
        defaultValue: 1
        description: Specifies the vertical offset applied to the waveform in volts.
      NormalizedPhaseShift:
        offset: 24
        length: 4
        interfaceType: float
        minValue: -1
        maxValue: 1
        defaultValue: 0
        description: >-
          Specifies the phase shift relative to the period, from -1.0 (maximum
          right shift) to 1.0 (maximum left shift).
  SineSettings1:
    <<: *sineSettings
    address: 72
    description: Specifies the sine player settings for analog output channel 1.
  SineSettings2:
    <<: *sineSettings
    address: 73
    description: Specifies the sine player settings for analog output channel 2.
  SineSettings3:
    <<: *sineSettings
    address: 74
    description: Specifies the sine player settings for analog output channel 3.

  TrapezoidSettings0: &trapezoidSettings
    address: 75
    type: U8
    length: 40
    access: Write
    description: Specifies the trapezoid player settings for analog output channel 0.
    payloadSpec:
      <<: *functionPayload
      RampOnDuration:
        offset: 28
        length: 4
        interfaceType: uint
        defaultValue: 0
        description: Specifies the duration of the rising ramp in microseconds.
      PulseWidthDuration:
        offset: 32
        length: 4
        interfaceType: uint
        defaultValue: 0
        description: >-
          Specifies the total pulse width (including ramp-on and ramp-off
          duration) in microseconds.
      RampOffDuration:
        offset: 36
        length: 4
        interfaceType: uint
        defaultValue: 0
        description: Specifies the duration of the falling ramp in microseconds.
  TrapezoidSettings1:
    <<: *trapezoidSettings
    address: 76
    description: Specifies the trapezoid player settings for analog output channel 1.
  TrapezoidSettings2:
    <<: *trapezoidSettings
    address: 77
    description: Specifies the trapezoid player settings for analog output channel 2.
  TrapezoidSettings3:
    <<: *trapezoidSettings
    address: 78
    description: Specifies the trapezoid player settings for analog output channel 3.

bitMasks:
  DigitalInputs:
    description: Specifies the external trigger input lines available on the device.
    bits:
      None:
        value: 0x0
        description: No digital input line is selected.
      DI0:
        value: 0x1
        description: External trigger input line 0.
      DI1:
        value: 0x2
        description: External trigger input line 1.
      DI2:
        value: 0x4
        description: External trigger input line 2.
      DI3:
        value: 0x8
        description: External trigger input line 3.

  DigitalOutputs:
    description: Specifies the digital output lines available on the device.
    bits:
      None:
        value: 0x0
        description: No digital output line is selected.
      DO0:
        value: 0x1
        description: Digital output line 0.
      DO1:
        value: 0x2
        description: Digital output line 1.
      DO2:
        value: 0x4
        description: Digital output line 2.
      DO3:
        value: 0x8
        description: Digital output line 3.

  AnalogOutputs:
    description: Specifies the ten volt bipolar analog output channels available on the device.
    bits:
      None:
        value: 0x0
        description: No analog output channel is selected.
      AO0:
        value: 0x1
        description: Analog output channel 0.
      AO1:
        value: 0x2
        description: Analog output channel 1.
      AO2:
        value: 0x4
        description: Analog output channel 2.
      AO3:
        value: 0x8
        description: Analog output channel 3.

groupMasks:
  PlayerType:
    description: Specifies the waveform player driving an analog output channel.
    values:
      File:
        value: 0
        description: Plays samples streamed from a file on the SD card.
      Sine:
        value: 1
        description: Plays a synthesized sine waveform.
      Trapezoid:
        value: 2
        description: Plays a synthesized trapezoid waveform.

  DIPinMode:
    description: Specifies the function of a digital input pin.
    values:
      None:
        value: 0
        description: Setting the pin HIGH does nothing.
      ExternalTrigger:
        value: 1
        description: Setting the pin HIGH will start the assigned AO channels.
      Blanking:
        value: 2
        description: >-
          Setting the pin HIGH will mute (i.e set to 0[V]) the assigned AO
          channels until the pin is brought low.

  DOPinMode:
    description: Specifies the digital output pin function
    values:
      None:
        value: 0
        description: >
          The pin is a plain digital output and can be controlled with DOPortSet
          and DOPortClear.
      Tracking:
        value: 1
        description: >
          The digital output pin will be HIGH as long as any assigned AO
          channels are active (including if they are muted) and LOW when all
          assigned AO channels are inactive.
